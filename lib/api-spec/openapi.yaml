openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI assistant operations
  - name: cosmos
    description: Public cached Earth and orbit feeds
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cosmos/feeds:
    get:
      operationId: getCosmosFeeds
      tags: [cosmos]
      summary: Get cached public ISS and earthquake feeds
      description: Returns public orbital and earthquake data fetched and cached by the server.
      responses:
        "200":
          description: Cached public feeds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CosmosFeedsResponse"
        "502":
          description: Public feed sources are temporarily unavailable
  /itcont/events/{slug}:
    get:
      operationId: getItcontEvent
      tags: [itcont]
      summary: Get public ITCONT event information
      description: Requires an ÍCARO user or administrator session. Returns only details published on the event page; no attendee records are stored.
      security:
        - IcaroSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 100
            pattern: '^[a-z0-9-]+$'
      responses:
        "200":
          description: Event details, program, guests, and public registration categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItcontEventDetail"
        "400":
          description: Invalid event slug
        "401":
          description: Authentication required
        "404":
          description: Event not found
        "500":
          description: Internal server error
  /ai/tts:
    post:
      operationId: speakAiText
      summary: Synthesize ÍCARO's voice from text
      tags:
        - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSpeechInput"
      responses:
        "200":
          description: Synthesized audio (WAV or MP3 depending on the provider)
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
        "429":
          description: Too many speech requests in a short period
        "503":
          description: No speech provider available or all providers failed
  /ai/voices:
    get:
      operationId: getAiVoices
      tags: [ai]
      summary: List male Portuguese voices available in the configured ElevenLabs account
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Voices available to the configured account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiVoiceCatalog"
        "400":
          description: Search term is invalid
        "502":
          description: ElevenLabs voice catalog is unavailable
        "503":
          description: ElevenLabs is not configured
  /tts-ts:
    post:
      operationId: synthesizeTtsTimestamps
      tags: [ai]
      summary: Synthesize ElevenLabs audio with character-level timestamps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsTimestampsInput"
      responses:
        "200":
          description: Base64 audio and character-level alignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsTimestampsResult"
        "400":
          description: Invalid request
        "413":
          description: Text exceeds the supported character limit
        "429":
          description: Too many timestamped speech requests in a short period
        "502":
          description: ElevenLabs request failed or returned invalid data
        "503":
          description: ElevenLabs is not configured
        "504":
          description: ElevenLabs request timed out
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get configured AI provider status
      responses:
        "200":
          description: Provider availability without exposing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderStatus"
  /ai/chat:
    post:
      operationId: sendAiMessage
      tags: [ai]
      summary: Ask an AI provider a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "400":
          description: Invalid request or provider is not configured
        "429":
          description: Too many questions in a short period
        "502":
          description: AI provider request failed
        "503":
          description: Requested AI provider is not configured
  /ai/chat/stream:
    post:
      operationId: streamAiMessage
      tags: [ai]
      summary: Stream an automatically routed AI response
      description: Emits Server-Sent Events. Automatic mode uses only configured providers and never switches after answer text has been emitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: Provider metadata and incremental answer tokens
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request or streaming requires automatic provider mode
        "429":
          description: Too many questions in a short period
        "502":
          description: All configured providers failed before returning text
        "503":
          description: No automatic provider is configured
  /ia/saude:
    get:
      operationId: getAiProviderHealth
      tags: [ai]
      summary: Get detailed provider health for administrators
      description: Requires an administrator session. Never returns credentials or prompts.
      responses:
        "200":
          description: Provider availability, latency, cooldown, and model health
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProviderHealth"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /ask/stats:
    get:
      operationId: getAskStats
      tags: [ai]
      summary: Get answer distribution by knowledge layer
      responses:
        "200":
          description: Layer resolution, token, and daily statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskStats"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /admin/cerebro/candidates:
    get:
      operationId: listCerebroCandidates
      tags: [ai]
      summary: List pending ÍCARO knowledge candidates
      responses:
        "200":
          description: Candidate list without stored embeddings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CerebroCandidate"
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
  /admin/cerebro/candidates/{id}/approve:
    post:
      operationId: approveCerebroCandidate
      tags: [ai]
      summary: Approve a pending candidate into the local bank or base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 24
            maxLength: 24
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CerebroCandidateApprovalInput"
      responses:
        "200":
          description: Candidate approved
        "400":
          description: Invalid destination
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Candidate not found or contains personal data
  /admin/cerebro/candidates/{id}:
    delete:
      operationId: discardCerebroCandidate
      tags: [ai]
      summary: Discard a pending ÍCARO knowledge candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 24
            maxLength: 24
      responses:
        "200":
          description: Candidate discarded
        "401":
          description: Authentication required
        "403":
          description: Administrator role required
        "404":
          description: Candidate not found or already reviewed
components:
  securitySchemes:
    IcaroSession:
      type: apiKey
      in: cookie
      name: icaro_session
  schemas:
    ItcontEventDetail:
      type: object
      additionalProperties: false
      required: [event, sessions, guests, registrationCategories]
      properties:
        event:
          $ref: "#/components/schemas/ItcontEvent"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ItcontEventSession"
        guests:
          type: array
          items:
            $ref: "#/components/schemas/ItcontEventGuest"
        registrationCategories:
          type: array
          items:
            $ref: "#/components/schemas/ItcontRegistrationCategory"
    ItcontEvent:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - summary
        - description
        - startsOn
        - endsOn
        - timezone
        - venue
        - address
        - city
        - state
        - country
        - organizerName
        - organizingProject
        - bannerUrl
        - logoUrl
        - sourceUrl
        - updatedAt
      properties:
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        description: { type: string }
        startsOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        endsOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string }
        venue: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        organizerName: { type: string }
        organizingProject: { type: string }
        bannerUrl: { type: string, format: uri }
        logoUrl: { type: string, format: uri }
        sourceUrl: { type: string, format: uri }
        updatedAt: { type: string, format: date-time }
    ItcontEventSession:
      type: object
      additionalProperties: false
      required: [date, title, startsAt, endsAt, sortOrder]
      properties:
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        title: { type: string }
        startsAt: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        endsAt: { type: string, pattern: '^\d{2}:\d{2}:\d{2}$' }
        sortOrder: { type: integer }
    ItcontEventGuest:
      type: object
      additionalProperties: false
      required: [name, imageUrl, sortOrder]
      properties:
        name: { type: string }
        imageUrl: { type: string, format: uri }
        sortOrder: { type: integer }
    ItcontRegistrationCategory:
      type: object
      additionalProperties: false
      required: [name, priceCents, currency, availableUntil, registrationUrl, sortOrder]
      properties:
        name: { type: string }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        availableUntil: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        registrationUrl: { type: string, format: uri }
        sortOrder: { type: integer }
    AiSpeechInput:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1200
        emotion:
          type: string
          enum: [entusiasmo, sério, curioso, alerta, sorriso]
        voice_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
    TtsTimestampsInput:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 600
        previous_text:
          type: string
          maxLength: 1200
        emotion:
          type: string
          enum: [entusiasmo, sério, curioso, alerta, sorriso]
        voice_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
    AiVoiceCatalog:
      type: object
      additionalProperties: false
      required: [voices]
      properties:
        voices:
          type: array
          items:
            $ref: "#/components/schemas/AiVoiceOption"
    AiVoiceOption:
      type: object
      additionalProperties: false
      required: [voiceId, name, labels]
      properties:
        voiceId:
          type: string
        name:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        labels:
          type: object
          additionalProperties:
            type: string
    TtsCharacterAlignment:
      type: object
      additionalProperties: false
      required:
        - characters
        - character_start_times_seconds
        - character_end_times_seconds
      properties:
        characters:
          type: array
          items:
            type: string
        character_start_times_seconds:
          type: array
          items:
            type: number
        character_end_times_seconds:
          type: array
          items:
            type: number
    TtsTimestampsResult:
      type: object
      additionalProperties: false
      required:
        - audio_base64
        - alignment
        - normalized_alignment
      properties:
        audio_base64:
          type: string
          format: byte
        alignment:
          $ref: "#/components/schemas/TtsCharacterAlignment"
        normalized_alignment:
          oneOf:
            - $ref: "#/components/schemas/TtsCharacterAlignment"
            - type: "null"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiProviderStatus:
      type: object
      properties:
        geminiAvailable:
          type: boolean
        openaiAvailable:
          type: boolean
        groqAvailable:
          type: boolean
        claudeAvailable:
          type: boolean
        speechAvailable:
          type: boolean
          description: Whether at least one server-side speech (TTS) provider is configured
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AiProviderHealth"
      required:
        - geminiAvailable
        - openaiAvailable
        - groqAvailable
        - claudeAvailable
        - speechAvailable
        - providers
    AiProviderId:
      type: string
      description: Provedores clássicos de chat exibidos individualmente no painel de conexão.
      enum: [gemini, openai, groq, claude]
    AiProviderHealth:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [groq, gemini, cerebras, openrouter, mistral, github, nvidia, cloudflare, huggingface, cohere, openai, claude]
        name:
          type: string
        configured:
          type: boolean
        available:
          type: boolean
        state:
          type: string
          enum: [not_configured, ready, cooldown, model_unavailable, auth_error, degraded]
        model:
          type: string
        privacyNote:
          type: string
        averageFirstTokenMs:
          oneOf:
            - type: integer
            - type: "null"
        errorRate:
          type: number
        cooldownMs:
          type: integer
      required: [id, name, configured, available, state, model, privacyNote, averageFirstTokenMs, errorRate, cooldownMs]
    LayerCount:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
        percent:
          type: number
      required: [count, percent]
    AskDailyStats:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        noAiPercent:
          type: number
        total:
          type: integer
      required: [date, noAiPercent, total]
    AskStats:
      type: object
      additionalProperties: false
      properties:
        total:
          type: integer
        byLayer:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LayerCount"
        tokensSpent:
          type: integer
        tokensSaved:
          type: integer
        daily:
          type: array
          items:
            $ref: "#/components/schemas/AskDailyStats"
      required: [total, byLayer, tokensSpent, tokensSaved, daily]
    CerebroCandidate:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        question:
          type: string
        answer:
          type: string
        layer:
          type: string
          enum: [L5, L6]
        provider:
          type: string
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
        count:
          type: integer
        status:
          type: string
          enum: [pending]
      required: [id, question, answer, layer, provider, firstSeenAt, lastSeenAt, count, status]
    CerebroCandidateApprovalInput:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination:
          type: string
          enum: [bank, base]
    AiChatHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
      required:
        - role
        - content
    DatasetRow:
      type: object
      additionalProperties:
        type: ["string", "null"]
    DatasetContext:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        columns:
          type: array
          maxItems: 60
          items:
            type: string
            maxLength: 160
        sampleRows:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DatasetRow"
        summary:
          type: string
          maxLength: 6000
      required:
        - name
        - columns
        - sampleRows
    AiChatInput:
      type: object
      properties:
        provider:
          type: string
          enum: [auto, gemini, openai, groq, claude, cerebras, openrouter, mistral, github, nvidia, cloudflare, huggingface, cohere]
        mode:
          type: string
          enum: [fast, deep]
        persona:
          type: string
          enum: [analyst, icaro]
          default: analyst
        question:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/AiChatHistoryMessage"
        knowledgeMode:
          type: string
          enum: [auto, base]
          default: auto
        dataset:
          oneOf:
            - $ref: "#/components/schemas/DatasetContext"
            - type: "null"
      required:
        - provider
        - question
        - history
        - dataset
    AiChatResponse:
      type: object
      properties:
        answer:
          type: string
        provider:
          type: string
          enum: [auto, gemini, openai, groq, claude, cerebras, openrouter, mistral, github, nvidia, cloudflare, huggingface, cohere, local]
        model:
          type: string
        layer:
          type: string
          enum: [L1, L2, L3, L4, L5, L6]
      required:
        - answer
        - provider
        - model
    CosmosIssCurrent:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
        longitude:
          type: number
        altitudeKm:
          type: number
        velocityKmh:
          type: number
        visibility:
          type: string
        timestamp:
          type: integer
      required: [latitude, longitude, altitudeKm, velocityKmh, visibility, timestamp]
    CosmosIssPoint:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
        longitude:
          type: number
        timestamp:
          type: integer
      required: [latitude, longitude, timestamp]
    CosmosEarthquake:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        magnitude:
          type: number
        place:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        depthKm:
          type: number
        occurredAt:
          type: integer
        url:
          type: string
      required: [id, magnitude, place, latitude, longitude, depthKm, occurredAt, url]
    CosmosFeedsResponse:
      type: object
      additionalProperties: false
      properties:
        updatedAt:
          type: integer
        stale:
          type: boolean
        ttlSeconds:
          type: integer
        iss:
          type: object
          additionalProperties: false
          properties:
            current:
              $ref: "#/components/schemas/CosmosIssCurrent"
            trajectory:
              type: array
              items:
                $ref: "#/components/schemas/CosmosIssPoint"
            nextPassAt:
              type: ["integer", "null"]
            nextPassDistanceKm:
              type: ["number", "null"]
          required: [current, trajectory, nextPassAt, nextPassDistanceKm]
        earthquakes:
          type: array
          items:
            $ref: "#/components/schemas/CosmosEarthquake"
      required: [updatedAt, stale, ttlSeconds, iss, earthquakes]

